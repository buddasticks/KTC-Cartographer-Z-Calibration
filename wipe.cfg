#######################################################################################################################################
# GLOBAL WIPE CONFIGURATION
#######################################################################################################################################
[gcode_macro _WIPE_NOZZLE_GLOBALS]
description: Global settings for nozzle brush wiping
variable_wipe_x_start: 10      # X position where the brush begins (mm)
variable_wipe_x_end: 40        # X position where the brush ends (mm)
variable_wipe_y: 8             # Y position of the brush (mm)
variable_wipe_z: 0.5           # Z height of the bristle contact during wipe (mm)
variable_wipe_qty: 6           # number of back-and-forth passes
variable_wipe_spd_xy: 200      # wipe drag speed in mm/s
variable_prep_spd_xy: 200      # travel speed to/from the wipe zone in mm/s
variable_prep_spd_z: 20        # Z travel speed in mm/s
variable_clearance_z: 5        # safe Z clearance for travel in/out
gcode:

#######################################################################################################################################
# MAIN WIPE MACRO — back-and-forth brush wipe, no purge
#######################################################################################################################################
[gcode_macro WIPE_NOZZLE]
description: Wipe the nozzle across a fixed brush. QTY=passes to override default.
gcode:
    SAVE_GCODE_STATE NAME=BEFORE_NOZZLE_WIPE

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESTORE_GCODE_STATE NAME=BEFORE_NOZZLE_WIPE
        {action_raise_error("Please home all axes first!")}
    {% endif %}

    {% set g   = printer['gcode_macro _WIPE_NOZZLE_GLOBALS'] %}
    {% set qty = params.QTY | default(g.wipe_qty) | int %}

    {% set current_z = printer.toolhead.position.z %}
    {% set safe_z    = [current_z, g.clearance_z] | max %}

    G90

    # lift clear before crossing to the wipe zone
    G1 Z{safe_z} F{g.prep_spd_z * 60}

    # travel to the brush start position
    G1 X{g.wipe_x_start} Y{g.wipe_y} F{g.prep_spd_xy * 60}

    # drop to bristle contact height
    G1 Z{g.wipe_z} F{g.prep_spd_z * 60}

    M117 Wiping nozzle...

    {% for i in range(qty) %}
        G1 X{g.wipe_x_end}   F{g.wipe_spd_xy * 60}
        G1 X{g.wipe_x_start} F{g.wipe_spd_xy * 60}
    {% endfor %}

    # lift clear again before leaving
    G1 Z{safe_z} F{g.prep_spd_z * 60}

    M117 Wipe done

    RESTORE_GCODE_STATE NAME=BEFORE_NOZZLE_WIPE
