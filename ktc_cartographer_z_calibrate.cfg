# KTC Cartographer Z Calibration
#
# Include this file from printer.cfg.
#
# Example:
# [include ktc_cartographer_z_calibrate.cfg]
[ktc_cartographer_z_calibrate]
# ------------------------------------------------------------
# Reference tool
# ------------------------------------------------------------
reference_tool: 0
# ------------------------------------------------------------
# Cartographer touch position
# ------------------------------------------------------------
probe_x: 175
probe_y: 175
# ------------------------------------------------------------
# Motion / safety
# ------------------------------------------------------------
lift_z: 10
travel_speed: 100
z_move_speed: 10
max_offset: 3.0
offset_decimals: 4
# ------------------------------------------------------------
# How long (seconds) to poll for the toolchanger to confirm an
# actual tool change before giving up. Only applies when a real
# reselect is issued (already-active tools are skipped entirely).
# ------------------------------------------------------------
select_tool_timeout: 2.0
# ------------------------------------------------------------
# Cartographer commands
# ------------------------------------------------------------
touch_home_gcode: CARTOGRAPHER_TOUCH_HOME
touch_probe_gcode: CARTOGRAPHER_TOUCH_PROBE
# ------------------------------------------------------------
# Nozzle wipe, run before every probe (reference tool included).
# Leave blank to disable. Your wipe macro is responsible for its
# own travel to/from the wipe station.
# ------------------------------------------------------------
wipe_gcode: WIPE_NOZZLE
# ------------------------------------------------------------
# Tool initialization / T0
#
# The Python calls _INITIALIZE_FROM_DETECTED_TOOL first.
#
# Then it calls T0.
#
# Your T0 macro is responsible for:
#   SELECT_TOOL T=0
#   CARTO_TOUCH_MODEL ACTION=load NAME=t0
# ------------------------------------------------------------
t0_gcode: T0
# ------------------------------------------------------------
# Calibration temperatures
#
# All tool heaters and the bed are started BEFORE waiting,
# so they heat in parallel.
# ------------------------------------------------------------
tool_calibrate_temperature: 145
bed_calibrate_temperature: 60
# ------------------------------------------------------------
# Actual Klipper heater names
#
# T0 -> extruder
# T1 -> extruder1
# T2 -> extruder2
# T3 -> extruder3
# ------------------------------------------------------------
bed_heater: heater_bed
tool0_heater: extruder
tool1_heater: extruder1
tool2_heater: extruder2
tool3_heater: extruder3
# ------------------------------------------------------------
# Runtime offset application
#
# SET_TOOL_PARAMETER only sets the value at runtime -- it does NOT
# register anything with configfile, so pressing Save Config alone
# would write nothing. persist_offsets additionally calls
# configfile.set() for each tool so the values ARE queued and get
# written into printer.cfg's auto-generated bottom section the next
# time SAVE_CONFIG runs (Mainsail/Fluidd Save Config button, or the
# SAVE_CONFIG gcode command). That still restarts the firmware, same
# as any other SAVE_CONFIG.
# ------------------------------------------------------------
apply_offset_gcode: SET_TOOL_PARAMETER T={tool} PARAMETER=gcode_z_offset VALUE={offset}
persist_offsets: True
# config_section must match your actual tool section headers,
# e.g. [tool T0], [tool T1] ...
config_section: tool T{tool}
config_option: gcode_z_offset
