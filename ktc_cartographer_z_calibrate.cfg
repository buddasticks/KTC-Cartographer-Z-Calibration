# KTC Cartographer Z Calibration
# Include this file from printer.cfg after the Python extra is installed.

[ktc_cartographer_z_calibrate]
reference_tool: 0

# Cartographer touch point
probe_x: 175
probe_y: 175

# Motion / safety
lift_z: 10
travel_speed: 100
z_move_speed: 10
max_offset: 3.0

# Cartographer commands
touch_home_gcode: CARTOGRAPHER_TOUCH_HOME
touch_probe_gcode: CARTOGRAPHER_TOUCH_PROBE

# Calibration temperatures
bed_calibrate_temperature: 60
tool_calibrate_temperature: 145
temperature_wait: True

# Actual heater names on the SV08 / KTC-Easy setup
tool0_heater: extruder
tool1_heater: extruder1
tool2_heater: extruder2
tool3_heater: extruder3
bed_heater: heater_bed

# Decimal precision shown in results
offset_decimals: 4
